# GitHub's macOS runners are not used (they bill at ten times Linux minutes), so the Swift tests
# run on a developer's Mac before a PR: `swift test`, the iOS Simulator run and
# `scripts/test-against-server.sh` (CLAUDE.md). CI keeps the check that needs no Mac: the corpus
# job fails when the vendored Atlas Markdown corpus has drifted from
# neutrino/specs/atlas-markdown/corpus on main, since the tests would otherwise pass against an
# out-of-date spec. The fix is `scripts/sync-atlas-markdown-corpus.sh`.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    name: Corpus in sync with neutrino
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wcherry/neutrino
          path: neutrino
          sparse-checkout: specs/atlas-markdown
      - name: Vendored corpus matches neutrino main
        run: NEUTRINO_DIR="$GITHUB_WORKSPACE/neutrino" scripts/sync-atlas-markdown-corpus.sh --check
